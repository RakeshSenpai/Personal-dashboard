<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Personal Dashboard</title>
</head>
<body>
    <main id="main">
        <!-- Sidebar -->
        <div class="side-bar"></div>
        <!-- Headers -->
        <div class="content">
            <div class="headings">
                <div class="text-heading">
                    <h2 class="heading">Good Evening Rakesh!!</h2>
                    <p>Keep going! you're one step ahead of your dream</p>                    
                </div>
                <div class="profile">
                    <input type="text" placeholder="Search" class="search-bar">
                    <div class="personal-profile">
                        <h2>Rakesh</h2>
                        <p>Front-end learner</p>
                    </div>               
                </div>
            </div>

        <!-- Progress container -->
        <div class="progress-container"></div>
        <!-- learning Path -->
         <div class="learning-path"></div>
         <!-- How much i learn so far in total -->
          <div class="learning-progress"></div>
          <!-- My recent activities -->
           <div class="recent-activities"></div>
        </div>
    </main>
</body>
</html>
